name: salus
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_markdown: ^0.7.0
  file_picker: ^8.1.2 # para pegar o arquivo pdf do exame
  geolocator: ^13.0.1 # para pegar a localização do usuário
  flutter_map: ^7.0.2 # para mostrar o mapa com a localização do usuário
  latlong2: ^0.9.1 # para trabalhar com coordenadas de latitude e longitude

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/avatars/